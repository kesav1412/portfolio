      <div class="chip"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.800v1.600M8 12.600v1.600M1.800 8h1.600M12.600 8h1.600M3.600 3.600l1.100 1.100M11.300 11.300l1.100 1.100M12.400 3.600l-1.100 1.100M4.700 11.300l-1.100 1.100"/></svg><span data-t="how.title"></span></div>
      <div class="how-text">
        <div class="layer" id="layerA"></div>
        <div class="layer" id="layerB"></div>
      </div>
      <div class="seg" id="seg">
        <div class="pill" id="segPill"></div>
      </div>
    </section>
  </div>
</div>
<div id="clock"></div>
<script src="cv.js" defer></script>

<script>
/* All text lives in content.json. Edit that file; this script only renders it. */
fetch('content.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(site => { render(site); start(site); })
  .catch(err => {
    const d = document.createElement('div');
    d.className = 'load-error';
    d.textContent = 'Could not load content.json (' + err.message + '). If you opened this file directly, serve the folder with a local server, for example: python -m http.server';
    document.body.appendChild(d);
  });

function render(site) {
  const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  document.title = site.meta.title;
  document.querySelector('meta[name="description"]').content = site.meta.description;

  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = get(site, n.dataset.t) ?? ''; });
  document.querySelectorAll('[data-href]').forEach(n => { n.href = get(site, n.dataset.href); });
  document.querySelectorAll('[data-aria]').forEach(n => { n.setAttribute('aria-label', get(site, n.dataset.aria)); });
  document.querySelectorAll('[data-mail]').forEach(n => { n.href = 'mailto:' + site.contact.email; });

  const av = document.getElementById('avatar');
  av.alt = site.person.photoAlt;
  av.addEventListener('error', () => {
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 145 145'><rect width='145' height='145' fill='#E9E6E1'/><text x='50%' y='58%' text-anchor='middle' font-family='sans-serif' font-size='44' fill='#77736E'>" + site.person.initials + "</text></svg>";
    av.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }, { once: true });
  av.src = site.person.photo;

  const titled = (ul, items) => items.forEach(it => {
    const li = el('li'); li.append(el('b', null, it.title));
    const em = el('em', null, it.detail);
    if (it.link) {
      em.append(' · ');
      const a = el('a', 'lnk', it.link.label); a.href = it.link.url; a.target = '_blank'; a.rel = 'noopener';
      em.append(a);
    }
    li.append(em); ul.append(li);
  });
  titled(document.getElementById('tl1'), site.experience.items);
  titled(document.getElementById('buildList'), site.building.items);
  titled(document.getElementById('eduList'), site.education.items);
  titled(document.getElementById('projList'), site.projects.items);

  const stack = document.getElementById('stackList');
  site.techStack.groups.forEach(g => {
    const row = el('div', 'grp'); row.append(el('span', 'gl', g.label));
    const tags = el('div', 'tags'); g.tags.forEach(t => tags.append(el('i', null, t)));
    row.append(tags); stack.append(row);
  });

  const seg = document.getElementById('seg');
  seg.style.setProperty('--steps', site.how.steps.length);
  site.how.steps.forEach(s => seg.append(el('button', null, s.tab)));
}

function start(site) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  /* ---- fit the 1440×960 stage ---- */
  const stage = $('stage'), narrow = matchMedia('(max-width:820px)');
  const fit = () => stage.style.setProperty('--s', narrow.matches ? 1 : Math.min(innerWidth / 1440, innerHeight / 960));
  addEventListener('resize', fit); fit();

  /* ---- one clock: currentTime of a long Web Animation ---- */
  const anim = $('clock').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1e9, fill: 'both' });
  const now = () => (Number(anim.currentTime) || 0) / 1000;

  /* ---- entrance ---- */
  const rises = [...document.querySelectorAll('.rise')];

  /* ---- experience loop ---- */
  const tl1 = $('tl1'), tl2 = $('tl2'), track = $('tlTrack');
  tl2.innerHTML = tl1.innerHTML;
  let tlH = 0;
  const measure = () => { tlH = tl1.offsetHeight; };
  addEventListener('load', measure); addEventListener('resize', measure); measure();

  /* ---- how I work ---- */
  const steps = site.how.steps, N = steps.length;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const layerHTML = s => `<h3><span>${esc(s.number)}</span>${esc(s.title)}</h3><p>${esc(s.text)}</p>`;
  const layers = [$('layerA'), $('layerB')], segBtns = [...document.querySelectorAll('#seg button')], pill = $('segPill');
  const STEP = 1.9, DUR = 0.42;
  const how = { baseT: 0, baseStep: 0, prev: 0, hold: STEP };
  segBtns.forEach((b, i) => b.onclick = () => {
    const t = now(), s = howState(t);
    how.prev = s.to;
    how.baseT = t; how.baseStep = i; how.hold = 6;
  });
  function howState(t) {
    if (reduce) return { from: 0, to: 0, q: 1 };
    const e = t - how.baseT;
    if (e < how.hold) return { from: how.prev, to: how.baseStep, q: clamp(e / DUR) };
    const k = 1 + Math.floor((e - how.hold) / STEP);
    const tc = how.baseT + how.hold + (k - 1) * STEP;
    return { from: (how.baseStep + k - 1) % N, to: (how.baseStep + k) % N, q: clamp((t - tc) / DUR) };
  }
  let lastKey = '';
  /* Download CV: the PDF is not a file on the site; it is decoded and built in the browser on click */
  $('cv').addEventListener('click', e => {
    e.preventDefault();
    if (!window.__cv) { location.href = 'mailto:' + site.contact.email + '?subject=' + encodeURIComponent(site.cv.fallbackEmailSubject); return; }
    const k = 'kv-1412', bin = atob(window.__cv), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ k.charCodeAt(i % k.length);
    const url = URL.createObjectURL(new Blob([u], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = site.cv.fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });
  $('theme').onclick = () => {
    const r = document.documentElement, t = r.dataset.theme === 'dark' ? 'light' : 'dark';
    r.dataset.theme = t; localStorage.setItem('theme', t);
  };
  const lerpC = (w) => { const a = document.documentElement.dataset.theme === 'dark' ? [166, 161, 154] : [119, 115, 110], c = a.map(v => Math.round(v + (255 - v) * w)); return `rgb(${c})`; };

  /* ---- frame ---- */
  function frame() {
    const t = reduce ? 0 : now();

    // entrance
    rises.forEach((el, i) => {
      const p = reduce ? 1 : outCubic(clamp((t - i * 0.08) / 0.7));
      el.style.opacity = p; el.style.translate = `0 ${(14 * (1 - p)).toFixed(2)}px`;
    });

    // available halo
    const hp = (t % 1.8) / 1.8, halo = $('halo');
    halo.style.transform = `scale(${1 + 1.4 * hp})`; halo.style.opacity = reduce ? 0 : (.55 * (1 - hp)).toFixed(3);

    // experience drift
    if (!reduce && tlH) track.style.transform = `translateY(${-((t * 9) % tlH).toFixed(2)}px)`;

    // how I work
    const s = howState(t), key = s.from + '-' + s.to;
    if (key !== lastKey) {
      layers[0].innerHTML = layerHTML(steps[s.from]); layers[1].innerHTML = layerHTML(steps[s.to]); lastKey = key;
    }
    const e = inOutCubic(s.q), same = s.from === s.to;
    layers[0].style.opacity = same ? 0 : 1 - e; layers[0].style.transform = `translateY(${(-12 * e).toFixed(2)}px)`;
    layers[1].style.opacity = same ? 1 : e;       layers[1].style.transform = `translateY(${(same ? 0 : 12 * (1 - e)).toFixed(2)}px)`;
    const pos = s.from + (s.to - s.from) * e;
    const segW = pill.offsetWidth;
    pill.style.transform = `translateX(${(pos * segW).toFixed(2)}px)`;
    segBtns.forEach((b, i) => { b.style.color = lerpC(clamp(1 - Math.abs(pos - i))); });

    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
}
</script>
</body>
</html>
